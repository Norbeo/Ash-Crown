<!doctype html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#07060a">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Couronne de Cendres">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon-64.png">
<title>Couronne de Cendres</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@500;700;900&family=Alegreya:ital,wght@0,400;0,600;0,800;1,400&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#07060a;--ink:#0b0807;--pan:rgba(16,12,14,.92);--pan2:rgba(26,19,20,.95);--line:#3a2a22;--gold:#c9a24a;--gold2:#e8c878;--goldd:#7a5a2a;--blood:#a0201a;--ember:#ff7a2a;--txt:#e6dccb;--dim:#9a8c7a;--good:#8fd07a;--bad:#ff6a5a;--blue:#7ab0ff;--purple:#c090ff;
--f-title:"Cinzel Decorative","Cinzel",serif;--f-head:"Cinzel",serif;--f-body:"Alegreya",Georgia,serif;--r:4px;--nav:64px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
.ic{width:1.2em;height:1.2em;vertical-align:-.22em;flex:none;display:inline-block}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:var(--f-body);font-size:16px;overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
#app{position:fixed;inset:0;z-index:1;pointer-events:none;display:flex;flex-direction:column}
#app>*{pointer-events:auto}
#hud{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 6px) 12px 6px;background:linear-gradient(#000c,#0000);flex-wrap:wrap;min-height:48px}
#hud .res{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-head);font-weight:700;font-size:15px;padding:3px 10px 3px 6px;border-radius:20px;background:#0009;border:1px solid #ffffff14;box-shadow:inset 0 0 10px #000}
#hud .res .ic{width:18px;height:18px}
#hud .title{font-family:var(--f-title);font-size:18px;color:var(--gold2);text-shadow:0 0 12px #ff7a2a66,0 2px 0 #000;margin-right:auto;letter-spacing:.04em}
#view{flex:1 1 auto;min-height:0;overflow-x:hidden;overflow-y:auto;position:relative;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y}
#view.pass{pointer-events:none}#view.pass>*{pointer-events:auto}
#view>.wrap{padding-bottom:28px}
.stickybar{position:sticky;bottom:0;z-index:4;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;margin:16px -12px 0;padding:12px 12px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(#07060a00,#07060af0 30%);backdrop-filter:blur(2px)}
.stickybar .btn.main{min-width:220px}
#nav{display:flex;justify-content:center;gap:4px;padding:6px 8px calc(env(safe-area-inset-bottom) + 6px);background:linear-gradient(#0000,#000e 30%);}
#nav button{flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;color:var(--dim);font-family:var(--f-head);font-size:11px;letter-spacing:.05em;padding:6px 2px;position:relative;cursor:pointer;transition:color .2s}
#nav button .ic{width:26px;height:26px;transition:transform .25s,filter .25s}
#nav button.on{color:var(--gold2)}#nav button.on .ic{filter:drop-shadow(0 0 6px #ff9a3a);transform:translateY(-2px) scale(1.08)}
#boot{position:fixed;inset:0;z-index:200;background:radial-gradient(ellipse at 50% 40%,#2a1408 0%,#0a0604 60%,#030202 100%);display:flex;align-items:center;justify-content:center;transition:opacity .9s}#boot.out{opacity:0;pointer-events:none}.bootin{text-align:center;width:min(340px,80vw)}.bootin img{width:120px;height:120px;object-fit:contain;filter:drop-shadow(0 0 18px #ff7a2a66);animation:bootpulse 2.4s ease-in-out infinite}.bootin h1{font-family:var(--f-title);color:var(--gold2);font-size:clamp(24px,7vw,36px);margin:10px 0 16px;text-shadow:0 0 14px #ff7a2a66}.bootbar{height:4px;background:#ffffff14;border-radius:3px;overflow:hidden}.bootbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#8a4a1a,#e8b060);box-shadow:0 0 10px #ff9a3a;transition:width .3s}.boottxt{margin-top:10px;font-size:13px;color:#b8a88a;letter-spacing:.05em}#bootskip{margin-top:14px}@keyframes bootpulse{50%{transform:scale(1.04);filter:drop-shadow(0 0 28px #ff7a2a99)}}
#artload{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 84px);transform:translateX(-50%);width:min(320px,70vw);z-index:60;pointer-events:none;text-align:center;font-size:11px;color:#b8a88a;letter-spacing:.06em;transition:opacity .8s}#artload i{display:block;height:3px;width:0;background:linear-gradient(90deg,#8a4a1a,#e8b060);border-radius:2px;box-shadow:0 0 8px #ff9a3a88;margin-bottom:5px;transition:width .3s}#artload.done{opacity:0}
.gl{border-bottom:1px dotted rgba(232,200,120,.55);cursor:help}[data-tip],[data-tipn]{cursor:help}
#tip{position:fixed;z-index:90;max-width:min(320px,calc(100vw - 16px));padding:9px 11px;background:linear-gradient(#1c1612,#0e0b09);border:1px solid #6a5232;border-radius:6px;box-shadow:0 6px 24px #000c,inset 0 0 0 1px #0008;font-size:13px;line-height:1.4;color:#d8ccb4;pointer-events:none}
#tip>b{display:flex;align-items:center;gap:6px;color:#e8c878;font-size:14px;margin-bottom:3px}#tip .gl{border:0;color:#f0d8a0}
.campparty{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px;margin:8px 0 12px}.cph{display:flex;gap:8px;align-items:center;padding:4px 8px 4px 4px;background:#0006;border:1px solid #2a2018;border-radius:6px}.cph.dead{opacity:.45}.cph canvas{flex:none}
.bar.hp i{background:linear-gradient(#e05a4a,#7a1a12)}.bar.hp i.gain{position:absolute;left:0;top:0;bottom:0;background:#6ac06a55;box-shadow:none}
.btn.choice .fxs{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px;justify-content:flex-start}.fx{font-size:11px;padding:1px 6px;border-radius:9px;background:#0008;border:1px solid #3a2e22;color:#b8a88a;font-weight:400;letter-spacing:0;text-transform:none}.fx.good{color:#9fd88a;border-color:#2e4a26}.fx.bad{color:#ff8a7a;border-color:#5a2420}.fx.risk{color:#e8c878;border-color:transparent;background:none;padding-left:0}
.sumstats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}.sumstat{display:flex;flex-direction:column;align-items:center;padding:6px;background:#0006;border:1px solid #2a2018;border-radius:6px}.sumstat b{font-size:18px;color:var(--gold2)}
.sumheroes{display:grid;gap:6px;margin-top:8px}.sumhero{display:flex;gap:8px;align-items:center;padding:4px 8px 4px 4px;background:#0006;border:1px solid #2a2018;border-radius:6px}.sumhero.dead{opacity:.55}.sumhero canvas{flex:none}
.num{color:#ffb08a;font-weight:700}.num.heal{color:#9fe08a}
#coach{position:fixed;z-index:80;width:min(380px,calc(100vw - 20px));padding:12px 14px;left:50%;transform:translateX(-50%);top:30%;box-shadow:0 8px 40px #000e;animation:fadein .3s}
#coach.at-bottom{top:auto;bottom:calc(env(safe-area-inset-bottom) + 200px)}#coach.at-tl{top:90px}#coach.at-tr{top:90px}
.coachon{outline:2px solid #e8c878;outline-offset:3px;border-radius:6px;box-shadow:0 0 18px #e8a03a88}
@keyframes fadein{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
.ic.pic{object-fit:contain;transform:scale(1.18);pointer-events:none}#nav button .ic.pic{opacity:.75;filter:none}#nav button.on .ic.pic{opacity:1;filter:none;transform:translateY(-2px) scale(1.3)}
#nav button.on::after{content:"";position:absolute;bottom:0;left:30%;right:30%;height:2px;background:linear-gradient(90deg,transparent,var(--ember),transparent);box-shadow:0 0 8px var(--ember)}
#nav .badge{position:absolute;top:2px;right:28%;min-width:16px;height:16px;border-radius:8px;background:var(--blood);color:#fff;font-size:10px;line-height:16px;font-family:var(--f-body);box-shadow:0 0 8px #f00a;animation:pulse 1.6s infinite}
@keyframes pulse{50%{transform:scale(1.15)}}
/* panneaux */
.panel{background:var(--pan);border:1px solid #2a1e18;border-radius:var(--r);box-shadow:0 0 0 1px #000,inset 0 0 0 1px #ffffff08,inset 0 0 40px #000c,0 12px 40px #000a;position:relative}
.panel::before{content:"";position:absolute;inset:3px;border:1px solid #c9a24a26;border-radius:2px;pointer-events:none}
.frame{position:relative;padding:16px}
.frame .corner{position:absolute;width:18px;height:18px;border:2px solid var(--goldd);opacity:.8}
.frame .c1{top:-1px;left:-1px;border-right:0;border-bottom:0}.frame .c2{top:-1px;right:-1px;border-left:0;border-bottom:0}.frame .c3{bottom:-1px;left:-1px;border-right:0;border-top:0}.frame .c4{bottom:-1px;right:-1px;border-left:0;border-top:0}
.wrap{max-width:980px;margin:0 auto;padding:10px 12px 20px}
h1,h2,h3{font-family:var(--f-head);margin:0 0 8px;letter-spacing:.04em;font-weight:700}
h1{font-family:var(--f-title);color:var(--gold2);font-size:26px;text-shadow:0 0 18px #ff6a2a55,0 2px 0 #000}
h2{color:var(--gold);font-size:19px;display:flex;align-items:center;gap:8px}
h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,#c9a24a66,transparent)}
h3{font-size:15px;color:var(--gold2)}
p{margin:6px 0;line-height:1.45}
.dim{color:var(--dim)}.good{color:var(--good)}.bad{color:var(--bad)}.gold{color:var(--gold2)}.small{font-size:13px}.tiny{font-size:11.5px}
.lore{font-style:italic;color:#c8b8a0;line-height:1.5}
/* boutons */
.btn{font-family:var(--f-head);font-weight:700;font-size:14px;letter-spacing:.06em;color:var(--txt);background:linear-gradient(#2e2420,#16100e);border:1px solid #4a3426;border-radius:3px;padding:10px 16px;cursor:pointer;position:relative;box-shadow:inset 0 1px 0 #ffffff14,inset 0 -2px 6px #000a,0 2px 6px #000a;transition:transform .12s,box-shadow .2s,border-color .2s,filter .2s;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-transform:uppercase}
.btn:hover{border-color:#8a5a2a;box-shadow:inset 0 1px 0 #ffffff14,inset 0 -2px 6px #000a,0 0 14px #ff6a2a44}
.btn:active{transform:translateY(1px) scale(.98)}
.btn .ic{width:18px;height:18px}
.btn.main{background:linear-gradient(#7a2414,#3a0e08);border-color:#c9643a;color:#ffe8c8;text-shadow:0 1px 0 #000;box-shadow:inset 0 1px 0 #ffffff30,0 0 18px #ff4a1a55}
.btn.main:hover{box-shadow:inset 0 1px 0 #ffffff30,0 0 26px #ff6a2a99}
.btn.gold{background:linear-gradient(#6a5020,#2e200a);border-color:#c9a24a;color:#fff0c8}
.btn.ghost{background:#0006;border-color:#3a2a22}
.btn.sm{padding:6px 10px;font-size:12px}
.btn:disabled,.btn.off{filter:grayscale(.9) brightness(.6);cursor:default;pointer-events:none}
.btn.glow{animation:btnglow 1.8s infinite}
@keyframes btnglow{50%{box-shadow:inset 0 1px 0 #ffffff30,0 0 30px #ff7a2aaa}}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row.sp{justify-content:space-between}.col{display:flex;flex-direction:column;gap:8px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(var(--min,230px),1fr))}
.grid.ctr{grid-template-columns:repeat(auto-fit,minmax(var(--min,230px),250px));justify-content:center}
.card{background:var(--pan2);border:1px solid #2e221c;border-radius:4px;padding:10px;position:relative;transition:transform .2s,border-color .2s,box-shadow .2s;cursor:pointer;overflow:hidden}
.card:hover{border-color:#7a5a2a;box-shadow:0 0 16px #ff6a2a22;transform:translateY(-2px)}
.card.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 0 22px #ffb04a44}
.card.lock{filter:grayscale(.8) brightness(.55)}
.card canvas.port{display:block;margin:0 auto}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-family:var(--f-head);padding:2px 7px;border-radius:10px;background:#0008;border:1px solid #ffffff1a;white-space:nowrap}
.tag .ic{width:13px;height:13px}
.bar{height:8px;background:#000a;border:1px solid #000;border-radius:5px;overflow:hidden;position:relative;box-shadow:inset 0 1px 3px #000}
.bar>i{position:absolute;inset:0 auto 0 0;background:linear-gradient(#e04a3a,#7a1410);border-radius:5px;transition:width .4s}
.bar.xp>i{background:linear-gradient(#e8c870,#8a6420)}.bar.blue>i{background:linear-gradient(#7ab0ff,#2a4a8a)}
.rar0{color:#c8beaa}.rar1{color:#8ad07a}.rar2{color:#6ab0ff}.rar3{color:#c87aff}.rar4{color:#ffb848;text-shadow:0 0 8px #ff8a2a88}.rar5{color:#ff5a7a;text-shadow:0 0 9px #ff2a4a99}.rar6{color:#8af4ff;text-shadow:0 0 10px #3ae0ff,0 0 3px #fff}
.slot.r5{border-color:#d03a5a;box-shadow:inset 0 0 12px #000,0 0 12px #ff2a4a88}.slot.r6{border-color:#5ae0f0;box-shadow:inset 0 0 12px #000,0 0 14px #3ae0ffaa}
.slot{width:58px;height:58px;border-radius:4px;background:radial-gradient(#2a201c,#0e0a0a);border:1px solid #3a2a22;display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer;box-shadow:inset 0 0 12px #000}
.slot .ic{width:30px;height:30px}
.eqrow{display:flex;flex-direction:column;gap:4px;padding:7px 9px;margin-top:6px;border:1px solid #3a2e24;border-left:3px solid #4a3a2a;border-radius:4px;background:#0f0b09}
.eqrow.better{border-left-color:#7ab04a;background:linear-gradient(90deg,#16200e,#0f0b09 60%)}
.eqtop{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.eqwho{display:flex;align-items:center;gap:5px;flex-wrap:wrap;min-width:0}
.eqcmp{display:flex;flex-direction:column;gap:3px}.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:11px;line-height:1;padding:3px 6px;border-radius:3px;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip.up{color:#a8e07a;background:#1e2e12;border:1px solid #3a5a24}.chip.down{color:#f08a7a;background:#2e1410;border:1px solid #5a2a20}
.syn{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.synr{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;padding:5px 9px;border:1px solid #3a2e24;border-radius:4px;background:#120e0c;cursor:pointer}
.synr.on{border-color:#8a6a2a;background:linear-gradient(90deg,#2a1e10,#120e0c)}.synr .ic{align-self:center}
.slot img.itimg{width:100%;height:100%;object-fit:contain;padding:2px;pointer-events:none}
.slot.r1{border-color:#4a7a3a;box-shadow:inset 0 0 12px #000,0 0 6px #5a9a4a55}.slot.r2{border-color:#3a6aaa;box-shadow:inset 0 0 12px #000,0 0 8px #3a6aaa55}.slot.r3{border-color:#8a4ac0;box-shadow:inset 0 0 12px #000,0 0 10px #8a4ac066}.slot.r4{border-color:#d0902a;box-shadow:inset 0 0 12px #000,0 0 14px #ffa03a88}
.slot .tier{position:absolute;bottom:1px;right:3px;font-family:var(--f-head);font-size:10px;color:var(--gold2)}
.slot .up{position:absolute;top:1px;left:3px;font-size:10px;color:var(--good);font-weight:800}
/* fenêtre modale */
#modal{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:#000b;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);padding:12px;animation:fade .25s}
#modal[hidden]{display:none}
#modal .box{max-width:560px;width:100%;max-height:calc(100% - 24px);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y;animation:rise .35s cubic-bezier(.2,.9,.3,1.2)}
#modal .box.wide{max-width:860px}
@keyframes fade{from{opacity:0}}@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.96)}}
#toasts{position:fixed;top:calc(env(safe-area-inset-top) + 56px);left:50%;transform:translateX(-50%);z-index:30;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(92vw,440px)}
.toast{background:#120c0cee;border:1px solid #5a3a22;border-left:3px solid var(--gold);padding:8px 14px;border-radius:3px;font-size:14px;box-shadow:0 6px 20px #000c;animation:tin .35s ease-out,tout .4s ease-in 2.8s forwards;text-align:center}
.toast.bad{border-left-color:var(--bad)}.toast.good{border-left-color:var(--good)}.toast.epic{border-left-color:var(--purple);box-shadow:0 0 24px #c090ff55}
@keyframes tin{from{opacity:0;transform:translateY(-12px)}}@keyframes tout{to{opacity:0;transform:translateY(-8px)}}
.enter>*{animation:rise .45s cubic-bezier(.2,.9,.3,1) both}.enter>*:nth-child(2){animation-delay:.05s}.enter>*:nth-child(3){animation-delay:.1s}.enter>*:nth-child(4){animation-delay:.15s}.enter>*:nth-child(5){animation-delay:.2s}
/* écran-titre */
.titlebox{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 16px calc(env(safe-area-inset-bottom) + 9vh);gap:12px;text-align:center}
.logo{font-family:var(--f-title);font-weight:900;font-size:clamp(36px,8vw,76px);line-height:.95;color:#f0d8a0;text-shadow:0 0 30px #ff5a1a,0 0 60px #ff3a0a88,0 4px 0 #3a1408,0 6px 20px #000;letter-spacing:.02em;animation:logo 4s ease-in-out infinite}
.logo small{display:block;font-size:.3em;letter-spacing:.5em;color:#c8a070;text-shadow:0 0 10px #000;margin-top:8px}
@keyframes logo{50%{text-shadow:0 0 40px #ff7a2a,0 0 80px #ff4a1aaa,0 4px 0 #3a1408,0 6px 20px #000}}
.titlebox .btn{min-width:240px}
/* hameau */
.hot{position:absolute;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:0;border-radius:8px;gap:3px;cursor:pointer;background:none;border:0;color:var(--txt);font-family:var(--f-head);font-size:12px;text-shadow:0 2px 4px #000,0 0 10px #000;transition:transform .2s}
.hot:hover,.hot:active{background:radial-gradient(closest-side,#ffb04a14,transparent)}.hot:hover .lbl,.hot:active .lbl{border-color:var(--gold);box-shadow:0 0 12px #ffb04a66}
.hot .lbl{background:#000a;border:1px solid #c9a24a55;padding:3px 9px;border-radius:10px;white-space:nowrap;display:flex;gap:5px;align-items:center}
.hot .lbl b{color:var(--gold2)}
.hot .dotn{width:9px;height:9px;border-radius:50%;background:var(--ember);box-shadow:0 0 8px var(--ember);animation:pulse 1.4s infinite}
/* combat */
#cbar{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:6px 8px calc(env(safe-area-inset-bottom) + 6px);background:linear-gradient(#0000,#000e 25%);display:flex;flex-direction:column;gap:6px;align-items:center}
#cbar .skills{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;max-width:100%}
.partyrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;max-width:520px;margin:0 auto}
.partyrow canvas{width:100%;height:auto;max-width:96px}
.partyrow .btn.sm{padding:5px 7px}
.sk{width:66px;min-height:72px;background:linear-gradient(#251c18,#100a08);border:1px solid #4a3426;border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:4px 2px;cursor:pointer;font-family:var(--f-head);font-size:9.5px;line-height:1.05;text-align:center;color:var(--txt);position:relative;transition:transform .12s,box-shadow .2s;box-shadow:inset 0 0 12px #000}
.sk .ic{width:28px;height:28px}
.sk.on{border-color:var(--gold);box-shadow:inset 0 0 12px #000,0 0 14px #ffb04a88;transform:translateY(-3px)}
.sk.no{filter:grayscale(1) brightness(.45);cursor:default}
.sk .cd{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#000a;font-size:20px;color:var(--gold2)}
.sk.ult{border-color:#a05a2a;background:radial-gradient(#4a1a0a,#140806)}.sk.ult.ready{animation:btnglow 1.2s infinite;border-color:#ffb04a}
.sk.pet{border-color:#5a7a3a;background:radial-gradient(#1e2e12,#0c1006)}

const easeBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const sum = arr => arr.reduce((a, b) => a + b, 0);
const uid = (() => { let n = 0; return p => (p || "u") + (Date.now() % 1e7).toString(36) + (n++).toString(36); })();
const fmt = n => { n = Math.round(n); return n >= 1e6 ? (n / 1e6).toFixed(n >= 1e7 ? 0 : 1).replace(".", ",") + " M" : n >= 1e4 ? Math.round(n / 1000) + " k" : String(n).replace(/\B(?=(\d{3})+(?!\d))/g, " "); };
const pct = v => Math.round(v * 100) + " %";
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const deepCopy = o => JSON.parse(JSON.stringify(o));
const dayKey = (d = new Date()) => d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
const hashStr = s => { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };

function roman(n) { n = Math.max(1, Math.floor(n)); if (n > 3999) return String(n); const V = [[1000, "M"], [900, "CM"], [500, "D"], [400, "CD"], [100, "C"], [90, "XC"], [50, "L"], [40, "XL"], [10, "X"], [9, "IX"], [5, "V"], [4, "IV"], [1, "I"]]; let s = ""; for (const [v, r] of V) while (n >= v) { s += r; n -= v; } return s; }

// nom court d'une unité : sans article (« Le Docteur Peste » → « Docteur Peste »), un ou deux mots
function shortName(n) { const w = String(n || "").replace(/^(le|la|les|l')\s*/i, "").split(/[ ,]+/).filter(Boolean); if (!w.length) return n; const two = w.length > 1 && /^[A-ZÉÈÀ]/.test(w[1]) && (w[0] + " " + w[1]).length <= 14; return two ? w[0] + " " + w[1] : w[0]; }

function activeSynergies(classes) {
  const roles = classes.map(c => CLASSES[c] && CLASSES[c].role);
  return Object.keys(SYNERGIES).filter(k => { const Y = SYNERGIES[k];
    if (Y.need && !Y.need.every(g => g.some(c => classes.includes(c)))) return false;
    if (Y.tanks && roles.filter(r => r === "tank").length < Y.tanks) return false;
    if (Y.roles && !Y.roles.every(r => roles.includes(r))) return false;
    if (Y.count && !Object.entries(Y.count).every(([r, n]) => roles.filter(x => x === r).length >= n)) return false;
    if (Y.none && Y.none.some(r => roles.includes(r))) return false;
    return true; });
}

  ["feu_follet", "Le feu follet", "Une petite flamme bleue danse devant vous et s'éloigne, comme pour vous guider.", [["La suivre", EVG(.5, { relic: 1 }, { hurt: .12, light: -15 })], ["La capturer dans une lanterne", { light: 25 }], ["L'ignorer", {}]]],
  ["mendiant", "Le mendiant sans yeux", "« Une pièce pour un aveugle, et je vous dirai ce que je vois. »", [["Lui donner 25 or", { cost: 25, gamble: [.7, { relic: 1 }, { morale: 5 }] }], ["Lui donner une potion", { potionCost: 1, xp: 40, morale: 10 }], ["Le chasser", { morale: -6 }]]],
  ["tombe_ouverte", "La tombe ouverte", "Une tombe fraîchement creusée. Vide. La pelle est encore plantée dans la terre.", [["Regarder au fond", EVG(.5, { trinket: 1 }, { morale: -10 })], ["Combler la tombe", { morale: 8, xp: 15 }], ["Prendre la pelle et partir", { mat: 1 }]]],
  ["chant_lointain", "Un chant lointain", "Des voix chantent un hymne oublié, quelque part derrière les murs.", [["Chanter avec elles", { morale: 15 }], ["Chercher les chanteurs", EVG(.45, { heal: .25, xp: 30 }, { fight: 1 })], ["Se boucher les oreilles", { light: 5 }]]],
  ["carcasse_dragon", "Les os du dragon", "Le squelette d'une bête immense barre le passage. Ses écailles noircies jonchent le sol.", [["Arracher des écailles", { mat: 4, ess: 1 }], ["Fouiller la cage thoracique", EVG(.55, { loot: 1, gold: 40 }, { hurt: .1 })], ["Contourner", { light: -5 }]]],
  ["vieux_soldat", "Le vieux soldat", "Un vétéran manchot affûte une épée qu'il ne peut plus tenir. « Je vous apprends un tour, si vous écoutez. »", [["Écouter ses leçons", { xp: 55 }], ["Lui acheter son épée (60 or)", { cost: 60, loot: 1 }], ["Partager votre feu", { morale: 10, heal: .1 }]]],
  ["pierre_runique", "La pierre runique", "Une pierre levée vibre sous la main. Les runes s'allument à votre contact.", [["Poser les mains", EVG(.6, { buff: 1, morale: 8 }, { hurt: .1 })], ["Graver votre nom", { xp: 30, morale: 5 }], ["Briser une rune", { ess: 2, curse: 1 }]]],
  ["corbeau_parlant", "Le corbeau parlant", "Un corbeau se pose sur une épaule. « Je connais un trésor. Une pièce et je parle. »", [["Le payer (15 or)", { cost: 15, gamble: [.75, { gold: 90 }, { gold: 10 }] }], ["Le nourrir", { petXp: 60 }], ["Le chasser", {}]]],
  ["lanterne", "La lanterne suspendue", "Une lanterne pend à une branche morte, flamme intacte. Personne alentour.", [["La prendre", { light: 30 }], ["Souffler la flamme", { morale: -5, xp: 20 }], ["La laisser aux suivants", { morale: 10 }]]],
  ["coffre_os", "Le coffre d'os", "Un petit coffre fait de côtes humaines. Il claque des mâchoires quand on approche.", [["L'ouvrir de force", EVG(.5, { trinket: 1, gold: 30 }, { hurt: .15, poison: 1 })], ["Le frapper à mort", { fight: 1, gold: 70 }], ["S'éloigner", {}]]],
  ["moine_muet", "Le moine muet", "Un moine vous tend un bol de soupe fumante sans dire un mot.", [["Manger", { heal: .2, morale: 6 }], ["Lui donner de l'or (30)", { cost: 30, cleanse: 1, heal: .3 }], ["Refuser poliment", {}]]],
  ["arbre_pendu", "L'arbre aux pendus", "Sept cordes, sept corps, et un huitième nœud qui attend.", [["Décrocher les corps", { morale: 10, light: -10 }], ["Fouiller les poches", { gold: 65, morale: -8 }], ["Couper le huitième nœud", { xp: 25 }]]],
  ["autel_lune", "L'autel de la lune", "Une vasque d'argent reflète une lune qui n'est pas dans le ciel.", [["Boire l'eau", EVG(.6, { heal: .35 }, { curse: 1 })], ["Y tremper une arme", { upgrade: 1 }], ["Verser l'eau", { light: 15 }]]],
  ["crieur", "Le crieur mort", "Un crieur public, raide, son parchemin à la main : « Prime pour la tête du gardien ! »", [["Lire la prime", { morale: 8, xp: 15 }], ["Prendre sa bourse", { gold: 45 }], ["Lui fermer les yeux", { morale: 5, light: 5 }]]],
  ["des_os", "La partie de dés", "Trois squelettes jouent aux dés autour d'un tonneau. L'un d'eux pousse une chaise vers vous.", [["Jouer 40 or", { cost: 40, gamble: [.5, { gold: 110 }, {}] }], ["Jouer votre sang", EVG(.5, { relic: 1 }, { hurt: .2 })], ["Renverser la table", { fight: 1, loot: 1 }]]],
  ["puits_sec", "Le puits sec", "Au fond, un éclat métallique. La corde semble solide… à peu près.", [["Descendre", EVG(.6, { loot: 1 }, { hurt: .12 })], ["Jeter une torche", { light: -10, gold: 40 }], ["Laisser tomber", {}]]],
  ["blason", "Le blason oublié", "Un écu fendu porte les armes d'une maison éteinte. Le métal est encore bon.", [["Récupérer le métal", { mat: 3 }], ["Le porter en bannière", { morale: 14 }], ["L'enterrer dignement", { xp: 30 }]]],
  ["vieille_carte", "La vieille carte", "Une carte griffonnée indique un raccourci… ou un piège.", [["Suivre le raccourci", EVG(.55, { light: 25, gold: 40 }, { fight: 1 })], ["La vendre plus tard", { gold: 35 }], ["La brûler pour se chauffer", { heal: .08, light: 10 }]]],
  ["cage_vide", "La cage vide", "Une cage de fer, porte arrachée de l'intérieur. Des poils noirs collent aux barreaux.", [["Suivre les traces", EVG(.5, { petXp: 90, gold: 30 }, { fight: 1 })], ["Démonter la cage", { mat: 2 }], ["Partir sans bruit", { light: 5 }]]],
  ["voleur_pris", "Le voleur pris au piège", "Un voleur se débat dans un collet. « Libérez-moi, je partage mon butin ! »", [["Le libérer", EVG(.6, { gold: 80 }, { gold: -0, morale: -8 })], ["Le dépouiller", { gold: 50, trinket: 1, morale: -6 }], ["L'abandonner", {}]]],
  ["herboriste", "L'herboriste", "Une vieille femme trie des herbes. « Pour les blessures, pour les fièvres… pour les ennemis. »", [["Acheter des simples (35 or)", { cost: 35, heal: .35 }], ["Acheter une potion (50 or)", { cost: 50, potion: 1 }], ["Acheter du poison (40 or)", { cost: 40, buff: 1 }]]],
  ["statue_saint", "La statue du saint", "Un saint de pierre tend la main. Dans sa paume, une goutte de cire chaude.", [["Prier", { morale: 12, cleanse: 1 }], ["Gratter l'or de son auréole", { gold: 60, curse: 1 }], ["Allumer un cierge", { light: 20 }]]],
  ["fosse_commune", "La fosse commune", "L'odeur est insoutenable. Parmi les corps, des armes et des armures.", [["Fouiller", EVG(.6, { loot: 1 }, { poison: 1 })], ["Bénir les morts", { morale: 10, xp: 20 }], ["Brûler la fosse", { light: 20, morale: -4 }]]],
  ["chien_errant", "Le chien errant", "Un chien maigre vous suit depuis des heures, la queue basse.", [["Le nourrir", { petXp: 70, morale: 6 }], ["Le suivre", EVG(.5, { gold: 70 }, { fight: 1 })], ["Le chasser", {}]]],
  ["autel_fer", "L'autel de fer", "Un autel de fonte brûlant au toucher. On y voit l'empreinte de mille lames.", [["Y poser une arme", { upgrade: 1, hurt: .06 }], ["Y verser du sang", { buff: 1, hurt: .1 }], ["Le refroidir à l'eau", { mat: 2 }]]],
  ["ermite", "L'ermite", "Un ermite assis dans le froid. « Posez une question. Une seule. »", [["« Où est le trésor ? »", { gold: 70 }], ["« Comment vaincre ? »", { xp: 50 }], ["« Qui sommes-nous ? »", { morale: 15 }]]],
  ["sanctuaire_brise", "Le sanctuaire brisé", "Le reliquaire a été fracassé. Il reste des éclats de verre teinté et un ossement doré.", [["Prendre l'ossement", EVG(.55, { relic: 1 }, { curse: 1 })], ["Ramasser les éclats", { ess: 1 }], ["Réparer ce qui peut l'être", { morale: 10, xp: 20 }]]],
  ["nuit_froide", "La nuit glaciale", "Le froid mord jusqu'aux os. Les torches crachotent.", [["Brûler du matériel", { light: 20, heal: .1 }], ["Se serrer autour du feu", { morale: 8, light: -10 }], ["Marcher pour se réchauffer", { xp: 20, light: -15 }]]],
  ["meute", "La meute affamée", "Des yeux jaunes entourent le campement. Des dizaines.", [["Les affronter", { fight: 1, xp: 30 }], ["Leur jeter des vivres", { potionCost: 1, morale: 5 }], ["Agiter les torches", { light: -20 }]]],
  ["cloche_eglise", "La cloche fêlée", "Une cloche de bronze gît au sol. Un seul coup suffirait à réveiller la contrée.", [["La sonner", EVG(.5, { morale: 20, relic: 1 }, { fight: 1 })], ["La démonter pour le métal", { mat: 4 }], ["La laisser dormir", {}]]],
  ["pelerins", "La caravane des pèlerins", "Des pèlerins en guenilles marchent vers un sanctuaire qui n'existe plus.", [["Les escorter un moment", { xp: 35, light: -10, morale: 10 }], ["Leur acheter des cierges (20 or)", { cost: 20, light: 30 }], ["Leur dire la vérité", { morale: -6, gold: 20 }]]],
  ["armure_rouillee", "L'armure debout", "Une armure complète, vide, se tient au garde-à-vous au milieu du chemin.", [["La saluer", { morale: 10 }], ["La démonter", EVG(.6, { loot: 1 }, { fight: 1 })], ["La renverser", { mat: 3 }]]],
  ["miroir_eau", "Le lac miroir", "Un lac si calme qu'il reflète des visages qui ne sont pas les vôtres.", [["Toucher l'eau", EVG(.5, { heal: .3, cleanse: 1 }, { morale: -12 })], ["Y jeter une pièce (10 or)", { cost: 10, morale: 10 }], ["Détourner le regard", {}]]],
  ["tresor_maudit", "Le trésor maudit", "Un tas d'or brille dans une niche. Trop facile.", [["Tout prendre", { gold: 160, curse: 1 }], ["En prendre un peu", { gold: 50 }], ["Laisser l'or", { morale: 8, xp: 15 }]]],
  ["guerisseuse", "La guérisseuse errante", "« Je soigne contre une histoire. La plus belle que vous connaissiez. »", [["Raconter un exploit", { heal: .3 }], ["Raconter une défaite", { heal: .15, xp: 30 }], ["Ne rien dire", {}]]],
  ["chaine", "Les chaînes au mur", "Des chaînes scellées au mur, un squelette encore pris dedans. Il tient quelque chose.", [["Ouvrir sa main", EVG(.65, { trinket: 1 }, { morale: -8 })], ["Briser les chaînes", { mat: 2, morale: 6 }], ["Passer", {}]]],
  ["brasero", "Le brasero éternel", "Un brasero brûle sans combustible. La chaleur rend des forces.", [["Se réchauffer", { heal: .15, light: 15 }], ["Y forger une lame", { upgrade: 1 }], ["Emporter des braises", { light: 30, hurt: .05 }]]],
  ["oracle_os", "Les osselets", "Une vieille jette des osselets sur une peau tannée. « Votre destin, pour 20 pièces. »", [["Payer (20 or)", { cost: 20, gamble: [.5, { buff: 1, morale: 10 }, { morale: -8 }] }], ["Voler les osselets", { trinket: 1, curse: 1 }], ["Refuser", {}]]],
  // ── Bourg pestiféré ──
  ["medecin_mort", "Le médecin de peste", "Un médecin au masque de bec gît contre une porte marquée d'une croix rouge. Sa sacoche est pleine.", [["Prendre ses remèdes", { potion: 1, heal: .1 }], ["Prendre son masque", { trinket: 1 }], ["Brûler le corps", { light: 15, morale: 5 }]], ["bourg"]],
  ["maison_close", "La maison condamnée", "Des planches clouées sur une porte. On gratte de l'intérieur.", [["Ouvrir", EVG(.4, { morale: 15, xp: 30 }, { fight: 1 })], ["Renforcer les planches", { morale: 6 }], ["Mettre le feu", { light: 20, morale: -10, gold: 30 }]], ["bourg"]],
  ["puits_peste", "Le puits empoisonné", "Le seau remonte une eau noire. Un rat crevé flotte dedans.", [["Filtrer l'eau", { heal: .12 }], ["Boire quand même", EVG(.4, { heal: .25 }, { poison: 1 })], ["Condamner le puits", { morale: 10, xp: 15 }]], ["bourg"]],
  ["taverne_vide", "La taverne déserte", "Les chopes sont encore pleines. Les clients sont partis… ou ils sont sous la table.", [["Boire un coup", { morale: 14, light: -5 }], ["Vider la caisse", { gold: 70 }], ["Fouiller la cave", EVG(.55, { loot: 1 }, { fight: 1 })]], ["bourg"]],
  ["enfants_chant", "La ronde des enfants", "Des enfants pâles font la ronde en chantant une comptine sur la peste.", [["Leur donner à manger", { potionCost: 1, morale: 16 }], ["Leur demander le chemin", { light: 20 }], ["S'éloigner vite", { morale: -6 }]], ["bourg"]],
  ["bucher", "Le bûcher", "Une foule en haillons s'apprête à brûler une femme accusée de sorcellerie.", [["La délivrer", EVG(.6, { relic: 1, morale: 10 }, { fight: 1 })], ["Acheter sa liberté (60 or)", { cost: 60, xp: 50, morale: 12 }], ["Ne pas s'en mêler", { morale: -12 }]], ["bourg"]],
  ["apothicaire", "L'apothicaire", "Fioles, racines, bocaux d'yeux. Le marchand sourit de toutes ses dents noires.", [["Acheter un tonique (45 or)", { cost: 45, heal: .4 }], ["Acheter une potion (55 or)", { cost: 55, potion: 1 }], ["Lui voler un bocal", EVG(.5, { ess: 2 }, { fight: 1 })]], ["bourg"]],
  ["fossoyeur", "Le fossoyeur", "« Je creuse depuis trois semaines. Ils reviennent toujours. »", [["L'aider à creuser", { xp: 40, light: -10 }], ["Lui payer à boire (15 or)", { cost: 15, morale: 10, gold: 0 }], ["Prendre ses outils", { mat: 2 }]], ["bourg"]],
  ["charnier_rats", "Le nid de rats", "Une marée de rats grouille sous une église. Ils protègent quelque chose qui brille.", [["Disperser les rats", { fight: 1, loot: 1 }], ["Enfumer le nid", { light: -15, gold: 60 }], ["Partir", {}]], ["bourg"]],
  ["cloche_peste", "La cloche des morts", "Un homme pousse une charrette de corps en agitant une clochette. « Vos morts ! Sortez vos morts ! »", [["Lui payer passage (20 or)", { cost: 20, light: 15, morale: 6 }], ["Fouiller la charrette", EVG(.5, { trinket: 1 }, { poison: 1 })], ["L'ignorer", {}]], ["bourg"]],
  // ── Forêt des pendus ──
  ["cercle_fees", "Le cercle de champignons", "Un cercle parfait de champignons phosphorescents. L'air y est plus doux.", [["Entrer dans le cercle", EVG(.5, { heal: .4, morale: 10 }, { light: -25 })], ["Cueillir les champignons", { ess: 1 }], ["Le contourner", {}]], ["foret"]],
  ["chasseur", "Le chasseur", "Un chasseur dépèce une bête aux bois noirs. « Vous en voulez ? C'est encore chaud. »", [["Partager la viande", { heal: .2, petXp: 50 }], ["Lui acheter des peaux (40 or)", { cost: 40, loot: 1 }], ["Lui demander sa route", { light: 15 }]], ["foret"]],
  ["arbre_creux", "L'arbre creux", "Un chêne immense, creusé par la foudre. On y a caché quelque chose.", [["Fouiller le tronc", EVG(.6, { gold: 80 }, { poison: 1 })], ["Y dormir", { heal: .2, light: -10 }], ["Graver un signe", { morale: 6 }]], ["foret"]],
  ["sorciere_haies", "La sorcière des haies", "Une femme couverte de ronces cueille des baies rouges. « Goûtez. »", [["Goûter", EVG(.5, { buff: 1, heal: .15 }, { poison: 1, hurt: .08 })], ["Lui offrir de l'or (30)", { cost: 30, relic: 1 }], ["Brûler ses ronces", { fight: 1, xp: 30 }]], ["foret"]],
  ["cerf_blanc", "Le cerf blanc", "Un cerf d'un blanc pur vous observe entre les arbres, puis s'en va lentement.", [["Le suivre", EVG(.6, { relic: 1, light: 10 }, { light: -20 })], ["Le chasser", { fight: 1, petXp: 80 }], ["Le laisser partir", { morale: 15 }]], ["foret"]],
  ["piege_loup", "Le piège à loups", "Un homme a la jambe broyée dans un piège. « Pitié… »", [["Le libérer", { morale: 10, xp: 25, hurt: .04 }], ["Lui laisser une potion", { potionCost: 1, morale: 12, gold: 40 }], ["Démonter le piège", { mat: 2, morale: -8 }]], ["foret"]],
  ["source_sang", "La source rouge", "L'eau qui jaillit de la roche a la couleur du sang. Elle sent le fer.", [["Boire", EVG(.55, { heal: .3, buff: 1 }, { hurt: .12 })], ["Remplir des fioles", { ess: 1 }], ["S'en écarter", {}]], ["foret"]],
  ["camp_bandits", "Le camp des brigands", "Un feu, des tentes, des brigands endormis. Leur butin est entassé près des chevaux.", [["Attaquer", { fight: 1, gold: 90 }], ["Voler en silence", EVG(.55, { loot: 1, gold: 40 }, { fight: 1 })], ["Les contourner", { light: -10 }]], ["foret"]],
  ["totem", "Le totem de bois", "Un totem grossier, couvert de plumes et de crânes d'oiseaux. Il semble vous regarder.", [["Y accrocher une offrande", { cost: 15, morale: 12, petXp: 40 }], ["L'abattre", { curse: 1, xp: 40 }], ["Passer en baissant les yeux", {}]], ["foret"]],
  ["ronces", "Le mur de ronces", "Des ronces épaisses bloquent le passage. Derrière, une lueur.", [["Tailler un chemin", { hurt: .1, gold: 60 }], ["Brûler les ronces", { light: -15, loot: 1 }], ["Faire le tour", { light: -10 }]], ["foret"]],
  // ── Catacombes ──
  ["sarcophage", "Le sarcophage scellé", "Le couvercle porte un avertissement en latin et des traces d'ongles.", [["Le desceller", EVG(.5, { relic: 1 }, { fight: 1 })], ["Lire l'avertissement", { xp: 35 }], ["Renforcer le sceau", { morale: 10 }]], ["catacombes"]],
  ["moine_ossements", "Le moine des ossements", "Un moine range des crânes par milliers. « Chacun à sa place. Il en manque un. »", [["L'aider à trier", { xp: 45, light: -10 }], ["Lui donner un crâne trouvé", { morale: 12, trinket: 1 }], ["Lui demander la sortie", { light: 20 }]], ["catacombes"]],
  ["eau_benite", "Le bénitier", "Un bénitier de marbre, encore plein. Les morts ne s'en approchent pas.", [["S'y laver", { cleanse: 1, heal: .15 }], ["Remplir des fioles", { buff: 1 }], ["Bénir vos armes", { upgrade: 1 }]], ["catacombes"]],
  ["galerie_effondree", "La galerie effondrée", "Le plafond s'est écroulé. Une main dépasse des gravats, une bague au doigt.", [["Dégager le corps", EVG(.6, { trinket: 1, gold: 30 }, { hurt: .1 })], ["Étayer et passer", { light: -10, xp: 20 }], ["Chercher un autre passage", { light: -15 }]], ["catacombes"]],
  ["crypte_noble", "La crypte noble", "Une famille entière repose ici, couverte de bijoux.", [["Prendre les bijoux", { gold: 120, curse: 1 }], ["Prendre une seule bague", { gold: 40 }], ["Prier pour eux", { morale: 12 }]], ["catacombes"]],
  ["chapelle_ossuaire", "La chapelle d'os", "Tout ici est fait d'os : l'autel, les lustres, les bancs. Une messe muette s'y tient.", [["Assister à la messe", EVG(.5, { morale: 18, heal: .2 }, { morale: -10 })], ["Voler le calice", { gold: 80, fight: 1 }], ["Sortir à reculons", {}]], ["catacombes"]],
  ["puits_ames", "Le puits des âmes", "Un puits sans fond d'où montent des murmures. Des noms. Les vôtres.", [["Répondre aux voix", EVG(.5, { relic: 1 }, { morale: -15 })], ["Y jeter une torche", { light: -15, ess: 2 }], ["Boucher le puits", { xp: 30 }]], ["catacombes"]],
  ["fresque", "La fresque", "Une fresque montre un roi couronné de cendres, et quatre héros qui lui ressemblent étrangement.", [["L'étudier", { xp: 50 }], ["Gratter l'or", { gold: 55 }], ["Prier devant", { morale: 12 }]], ["catacombes"]],
  ["gardien_os", "La sentinelle d'os", "Un squelette en armure garde une porte. Il ne bouge pas. Pas encore.", [["Le combattre", { fight: 1, loot: 1 }], ["Passer en rampant", EVG(.5, { gold: 70 }, { fight: 1 })], ["Lui laisser une pièce (10 or)", { cost: 10, light: 15 }]], ["catacombes"]],
  ["bibliotheque", "La bibliothèque engloutie", "Des rayonnages de grimoires pourrissent dans l'humidité. Quelques-uns sont lisibles.", [["Lire", { xp: 60, light: -10 }], ["Emporter un grimoire", EVG(.5, { relic: 1 }, { curse: 1 })], ["Brûler pour s'éclairer", { light: 35 }]], ["catacombes"]],
  // ── Marais des noyés ──
  ["barque", "La barque échouée", "Une barque prise dans les roseaux. Au fond, un coffre et une main verdâtre.", [["Prendre le coffre", EVG(.55, { loot: 1, gold: 40 }, { fight: 1 })], ["Utiliser la barque", { light: 15, heal: .1 }], ["La laisser couler", {}]], ["marais"]],
  ["feux_marais", "Les feux du marais", "Des lumières flottent au-dessus de l'eau. On dirait des lanternes portées par personne.", [["Les suivre", EVG(.45, { relic: 1 }, { hurt: .15, light: -15 })], ["Les capturer", { light: 25 }], ["Rester sur la terre ferme", {}]], ["marais"]],
  ["sangsues", "Le bain de sangsues", "Un guérisseur des marais propose ses sangsues. « Elles boivent le mauvais sang. »", [["Accepter", { cleanse: 1, heal: .2, hurt: .05 }], ["Lui acheter un onguent (30 or)", { cost: 30, heal: .3 }], ["Refuser", {}]], ["marais"]],
  ["noyee", "La noyée", "Une femme flotte à la surface, les yeux ouverts. Elle chante.", [["L'écouter", EVG(.5, { morale: 15, xp: 30 }, { morale: -15 })], ["La repêcher", { trinket: 1, hurt: .06 }], ["Lui fermer les yeux", { morale: 8 }]], ["marais"]],
  ["cabane_pilotis", "La cabane sur pilotis", "Une cabane branlante au-dessus de l'eau noire. Une marmite y bout.", [["Manger le ragoût", EVG(.6, { heal: .3 }, { poison: 1 })], ["Fouiller la cabane", { gold: 50, ess: 1 }], ["Y dormir", { heal: .15, light: -10 }]], ["marais"]],

function petSkillText(s) {

  if (s.heal) out.push(`Soigne ${tg} de ${Math.round(s.heal * 100)} %`);
  if (s.regen) out.push(`Régénération ${Math.round(s.regen * 100)} %`);
  if (s.shield) out.push(`Bouclier ${Math.round(s.shield * 100)} % sur ${tg}`);
  if (s.leechLow) out.push(`Soigne l'allié le plus blessé de ${Math.round(s.leechLow * 100)} % des dégâts`);
  if (s.cleanse1) out.push("Purge une altération");

  if (s.cr) out.push(`+${s.cr} % critique`);
  const fx = skillText({ t: s.t === "low" ? "a" : s.t, fx: s.fx, afx: s.afx });
  if (fx) out.push(fx);
  if (s.at && !s.m && !s.fx) out.push(`sur ${tg}`);

}

// ── Bulle d'information en combat : altérations (bonus/malus), intention ennemie, fiche d'unité ──
function stLine(st) {
  const I = ST_INFO[st.k] || { n: st.k, c: "#ddd" }, G = GLOSS[st.k], neg = NEG.has(st.k);
  const dur = st.t >= 50 ? "permanent" : st.t + " tour" + (st.t > 1 ? "s" : "");
  const val = st.v ? (["bleed", "poison", "burn", "regen", "shield", "thorns"].includes(st.k) ? ` · ${Math.round(st.v)}${st.k === "shield" ? " PV absorbés" : st.k === "regen" ? " PV/tour" : st.k === "thorns" ? " renvoyés" : " dégâts/tour"}` : Math.abs(st.v) < 1.01 && st.v % 1 ? ` · ${st.v > 0 ? "+" : "−"}${Math.round(Math.abs(st.v) * 100)} %` : ` · ${st.v > 0 ? "+" : "−"}${Math.round(Math.abs(st.v))}`) : "";
  return `<div class="cbi-st"><span class="cbi-ic" style="border-color:${I.c}">${ico(ST_IC[st.k] || "star", I.c, 16)}</span><div><b style="color:${I.c}">${I.n}</b> <span class="tiny ${neg ? "bad" : "good"}">${neg ? "malus" : "bonus"}</span> <span class="tiny dim">${dur}${val}</span><div class="tiny">${G ? G.d : ""}</div></div></div>`;
}
function intentHTML(u) {
  const B = CB.B, sk = u.intent && u.intent.sk; if (!sk) return "";
  const tt = sk.t || "e", tg = u.intent.tgt && unitById(B, u.intent.tgt);
  const kind = sk.heal || tt === "allies" ? "Soin ou renfort de ses alliés" : tt === "self" ? "Se protège ou se renforce" : !sk.m ? "Malédiction : altérations sans gros dégâts" : tt === "ae" ? "Attaque de zone : touche plusieurs héros" : "Attaque";
  return `<div class="cbi-int"><b class="bad">Intention : ${sk.n}</b><div class="tiny dim">${kind}${tg && tg.side === "h" ? ` · vise <b>${esc(tg.name)}</b>` : ""}</div><div class="tiny">${skillText(sk, u)}</div></div>`;
}
function cbInfo(u, what, px, py) {
  const B = CB.B; if (!B || !u) return;
  const seen = {}, sts = u.st.filter(s => !seen[s.k] && (seen[s.k] = 1));
  let h = `<div class="row sp" style="flex-wrap:nowrap"><b>${esc(u.name)}</b><span class="tiny dim">${u.side === "e" ? `niv ${u.lvl}${u.tags.includes("impie") ? " · impie" : ""}` : CLASSES[u.cls] ? CLASSES[u.cls].n : ""} · rang ${rankOf(B, u)}</span></div>`;
  if (what !== "st") h += `<div class="tiny">PV ${Math.ceil(u.hp)}/${u.hpMax} · Protection ${Math.round(effProt(u) * 100)} % · Vitesse ${Math.round(effSpd(u))} · Esquive ${Math.round(effDodge(u))}</div>`;
  if (what === "intent") h += intentHTML(u);
  if (what !== "intent") h += sts.length ? `<div class="cbi-list">${sts.map(stLine).join("")}</div>` : `<div class="tiny dim" style="margin-top:4px">Aucune altération.</div>`;
  if (what === "unit" && u.side === "e") h += intentHTML(u);
  let el = $("#cbinfo"); if (!el) { el = document.createElement("div"); el.id = "cbinfo"; document.body.appendChild(el); el.onclick = () => el.remove(); }
  el.innerHTML = h + `<div class="tiny dim" style="text-align:right;margin-top:4px">Touchez pour fermer</div>`;
  const W = window.innerWidth, w = Math.min(340, W - 24); el.style.width = w + "px";

// ── Histoire : scène dialoguée avant chaque chapitre ──
function sceneLineHTML([sp, txt]) { const P = SPEAKERS[sp] || SPEAKERS.narr; return P.n ? `<p class="scn"><b style="color:${P.c}">${P.n}</b><br>« ${txt} »</p>` : `<p class="scn lore">${txt}</p>`; }
// ── Mini-cinématiques de l'histoire : décor qui s'anime (lent zoom), bandes noires, carton-titre, portraits, texte qui s'écrit ──
const SCENE_BG = { bastion: "bastion" };
function scenePortrait(sp) {
  const P = SPEAKERS[sp] || SPEAKERS.narr, has = typeof artHas === "function" && artHas("por_" + sp);
  return has ? `<img class="cinepor" src="assets/por_${sp}.webp" alt="">` : `<div class="cinepor sil" style="--c:${P.c}"><span>${esc((P.n || "?").replace(/^(Frère|Le|La) /, "")[0])}</span></div>`;
}
function showScene(reg, done, custom) {
  const Sc = custom || SCENES[reg]; if (!Sc) return done && done();
  if (reg) { (S.seenScene = S.seenScene || {})[reg] = 1; save(); }
  const bgk = Sc.bg || (reg && artHas("bg_" + reg) ? reg : "bastion"), old = $("#cine"); if (old) old.remove();
  const el = document.createElement("div"); el.id = "cine";
  el.innerHTML = `<div class="cinebg" style="background-image:url(assets/bg_${bgk}.webp)"></div><div class="cinevig"></div><div class="cineash"></div><div class="cinebar t"></div><div class="cinebar b"></div>
    <div class="cinetitle"><div class="sub">${esc((Sc.t || "").split(" — ")[0])}</div><div class="main">${esc((Sc.t || "").split(" — ")[1] || "")}</div></div>
    <div class="cinedlg"></div><button class="btn ghost sm cineskip">Passer ⏭</button>`;
  document.body.appendChild(el);
  try { sfx("bell"); } catch (e) { }
  let i = -1, typing = null, full = "", tt = null;
  const end = () => { clearInterval(typing); clearTimeout(tt); el.classList.add("out"); setTimeout(() => { el.remove(); done && done(); }, 600); };
  const show = () => {
    i++; if (i >= Sc.lines.length) return end();
    const [sp, txt] = Sc.lines[i], P = SPEAKERS[sp] || SPEAKERS.narr, narr = !P.n, side = narr ? "" : (Sc._side = Sc._side || {}, Sc._side[sp] = Sc._side[sp] != null ? Sc._side[sp] : Object.keys(Sc._side).length % 2, Sc._side[sp] ? "r" : "l");
    const D = el.querySelector(".cinedlg");
    D.className = "cinedlg in " + (narr ? "narr" : side) + (sp === "voix" ? " voix" : "");
    D.innerHTML = narr ? `<p class="txt"></p>` : `${scenePortrait(sp)}<div class="cinetxt"><b style="color:${P.c}">${esc(P.n)}</b><p class="txt"></p></div>`;
    full = narr ? txt : "« " + txt + " »"; const T = D.querySelector(".txt"); let k = 0; clearInterval(typing);
    typing = setInterval(() => { k += 2; T.textContent = full.slice(0, k); if (k >= full.length) { clearInterval(typing); typing = null; } }, 22);
    if (sp === "voix") { el.classList.add("shake"); setTimeout(() => el.classList.remove("shake"), 600); }
  };
  const next = () => { if (typing) { clearInterval(typing); typing = null; el.querySelector(".cinedlg .txt").textContent = full; return; } show(); };
  el.addEventListener("click", e => { if (e.target.closest(".cineskip")) return end(); next(); });
  tt = setTimeout(() => { el.querySelector(".cinetitle").classList.add("gone"); show(); }, 2300);
  el.querySelector(".cinetitle").addEventListener("click", e => { e.stopPropagation(); clearTimeout(tt); el.querySelector(".cinetitle").classList.add("gone"); show(); });
}
ACT.replayScene = k => showScene(k);
ACT.replayEnd = k => SCENE_END[k] && showScene(null, null, { t: (SCENES[k] ? SCENES[k].t.split(" — ")[0] : "") + " — Épilogue", lines: [["narr", STORY[k] || ""]].concat(SCENE_END[k]), bg: artHas("bg_" + k) ? k : "bastion" });

  return fin + Object.keys(SCENES).filter(k => seen[k]).map(k => `<div class="panel" style="padding:12px;margin-top:10px"><div class="row sp"><h3 style="margin:0">${SCENES[k].t}</h3><span class="row" style="gap:4px"><button class="btn sm" data-a="replayScene" data-v="${k}">▶ Revoir</button>${S.prog[k] && S.prog[k].clears && SCENE_END[k] ? `<button class="btn sm ghost" data-a="replayEnd" data-v="${k}">▶ Épilogue</button>` : ""}</span></div>${SCENES[k].lines.map(sceneLineHTML).join("")}${S.prog[k] && S.prog[k].clears && SCENE_END[k] ? `<div class="sep"></div>${SCENE_END[k].map(sceneLineHTML).join("")}` : ""}</div>`).join("") || '<p class="tiny dim">Les dialogues des chapitres apparaîtront ici au fil de l\'aventure.</p>';

// ── Tomes d'expérience : réservés aux héros moins aguerris que le plus haut niveau du roster ──
function tomeCap() { return Math.max(1, ...S.heroes.map(h => h.lvl)); }
function tomeHTML(h) {
  const n = S.tomes || 0; if (!n) return "";
  const ok = h.lvl < tomeCap();
  return `<div class="panel" style="padding:10px;margin-top:10px"><div class="row sp"><div><b>${ico("book", "#9ad0ff", 14)} Tomes d'expérience : ${n}</b><div class="tiny dim">${ok ? `Un tome fait gagner un niveau, jusqu'au niveau ${tomeCap()} (le plus haut de votre compagnie).` : "Réservés aux héros d'un niveau inférieur au plus aguerri de la compagnie."}</div></div><button class="btn sm ${ok ? "gold" : "off"}" data-a="readTome" data-v="${h.id}">Lire</button></div></div>`;
}
ACT.readTome = id => { const h = heroById(id); if (!h || !(S.tomes > 0)) return; if (h.lvl >= tomeCap()) return toast("Ce héros est déjà parmi les plus aguerris.", "bad");
  S.tomes--; const need = xpNeed(h.lvl) - h.xp; giveXp(h, Math.max(1, Math.ceil(need / Math.max(.5, 1 + heroPassives(h).filter(p => p.k === "xp").reduce((a, p) => a + p.v, 0))))); sfx("level"); toast(`${esc(h.name)} passe niveau ${h.lvl}.`, "good"); save(); refresh(); };

}
ACT.teamSave = i => { const E = UI.expe; if (!E || !E.party.length) return; (S.teams = S.teams || [null, null, null])[+i] = { party: E.party.slice(), pet: E.pet }; save(); refresh(); toast(`Équipe ${+i + 1} enregistrée.`, "good"); };

// ── Journal du combat : qui a fait quoi, pour comprendre d'où viennent les dégâts ──
function cbLog(e) {
  const B = CB.B; if (!B || !CB.log) return; const N = id => { const u = unitById(B, id) || [...B.fallen, ...(B.dead || [])].find(x => x.uid === id); return u ? esc(shortName(u.name)) : id === "PET" ? "Compagnon" : "?"; };
  const side = id => { const u = unitById(B, id) || [...B.fallen].find(x => x.uid === id); return u && u.side === "h" ? "good" : "bad"; };
  let l = null;
  if (e.k === "act") l = `<b class="${side(e.u)}">${N(e.u)}</b> : ${esc(e.sk)}`;
  else if (e.k === "hit" && !e.dot) l = `&nbsp;→ ${N(e.u)} <b>−${e.dmg}</b>${e.crit ? " (critique)" : ""}`;
  else if (e.k === "dot") l = `&nbsp;${N(e.u)} −${e.dmg} (${(ST_INFO[e.st] || {}).n || e.st})`;
  else if (e.k === "heal" && e.v > 0) l = `&nbsp;→ ${N(e.u)} <span class="good">+${e.v}</span>`;
  else if (e.k === "miss") l = `&nbsp;→ ${N(e.u)} esquive`;
  else if (e.k === "st") l = `&nbsp;→ ${N(e.u)} : ${(ST_INFO[e.st] || {}).n || e.st}`;
  else if (e.k === "agony") l = `<span class="bad">${N(e.u)} est à l'agonie</span>`;
  else if (e.k === "fall") l = `<span class="bad">${N(e.u)} tombe</span>`;
  else if (e.k === "die") l = `<span class="good">${N(e.u)} est vaincu</span>`;
  else if (e.k === "pet") l = `<b class="good">Compagnon</b> : ${esc(e.sk)}`;
  if (l) { CB.log.push((B.round ? `<span class="tiny dim">T${B.round}</span> ` : "") + l); if (CB.log.length > 300) CB.log.shift(); miniLogRefresh(); }
}
ACT.cbLogShow = () => modal(`<h2>${ico("scroll", "#e8c878")} Journal du combat</h2><div class="small" style="max-height:60vh;overflow:auto;line-height:1.45" id="cblogbox">${(CB.log || []).slice(-150).join("<br>") || '<span class="dim">Rien pour l\'instant.</span>'}</div>`, { mount: m => { const b = m.querySelector("#cblogbox"); if (b) b.scrollTop = b.scrollHeight; } });

function turnQueue(B) { // reste du tour courant puis estimation du tour suivant (vitesse)
  const now = [], seen = new Set();
  for (let i = Math.max(0, B.turn); i < B.order.length; i++) { const u = unitById(B, B.order[i]); if (u && alive(u) && !seen.has(u)) { now.push(u); seen.add(u); } }
  const next = [...B.heroes, ...B.enemies].filter(alive).sort((a, b) => effSpd(b) - effSpd(a));
  return { now, next };
}

    let sx, sy, s;

      for (let y = 0; y < H * .6; y += 2) for (let x = 0; x < W * .62; x += 2) if (A(x, y)) { top = y; break; }

// ── Bastion vivant : fumées et fenêtres selon le niveau des bâtiments, héros qui flânent dans la cour ──
const BLIFE = { smoke: [], walk: null, sig: "" };
function bastionLife(x, L, t, dt) {
  const B = Object.fromEntries(L.map(b => [b.k, b]));
  const chim = { forge: [.06, 1.12, "#4a4440"], fonderie: [0, 1.08, "#3a5a4a"], taverne: [-.25, 1.12, "#4a4440"] }; // cheminées (décalage x, hauteur relative)
  for (const k in chim) { const b = B[k]; if (!b) continue; const lvl = S.bld[k] || 1, [ox, oy, col] = chim[k];
    if (Math.random() < dt * (1.5 + lvl * 1.2)) BLIFE.smoke.push({ x: b.x + ox * b.s, y: b.y - b.s * oy * (k === "forge" ? 1.1 : 1), vx: 6 + Math.random() * 8, vy: -18 - Math.random() * 14, r: b.s * .05, a: .35 + lvl * .04, col, life: 0 }); }
  BLIFE.smoke = BLIFE.smoke.filter(p => (p.life += dt) < 4.5);
  for (const p of BLIFE.smoke) { p.x += p.vx * dt; p.y += p.vy * dt; p.r += dt * 2.6; const a = p.a * .6 * (1 - p.life / 4.5); x.fillStyle = rgba(p.col, a); x.beginPath(); x.arc(p.x, p.y, p.r, 0, 7); x.fill(); }
  // braises de la forge et lueur des fenêtres : plus le bâtiment est développé, plus il vit
  const fl = (k, ox, oy, col, r) => { const b = B[k]; if (!b) return; const lvl = S.bld[k] || 1; glow(x, b.x + ox * b.s, b.y - oy * b.s, b.s * r * (.6 + lvl * .12), col, (.08 + lvl * .04) * (.75 + .25 * Math.sin(t * (5 + ox * 3) + b.x))); };
  fl("forge", 0, .25, "#ff7a2a", .5); fl("taverne", -.15, .45, "#ffb050", .55); fl("taverne", .2, .5, "#ffb050", .4); fl("chapelle", 0, .9, "#ffd890", .45); fl("fonderie", 0, .35, "#6aff9a", .45); fl("menagerie", 0, .3, "#ffa040", .35);
  // héros qui se promènent (jusqu'à 3, hors expédition)
  const idle = S.heroes.filter(h => !isInjured(h)).slice(0, 3), sig = idle.map(h => h.id).join(",") + "|" + Math.round(SC.w) + "x" + Math.round(SC.h);
  if (BLIFE.sig !== sig) { BLIFE.sig = sig; const ys = L.map(b => b.y), y0 = Math.min(...ys), y1 = Math.max(...ys);
    BLIFE.walk = idle.map((h, i) => { const y = Math.min(SC.h * .93, y1 + SC.h * (.025 + i * .028)); void y0; /* devant les bâtiments, sur le pavé */ return { id: h.id, x: SC.w * (.2 + Math.random() * .6), y, tx: SC.w * (.15 + Math.random() * .7), wait: Math.random() * 3, v: 26 + Math.random() * 14 }; }); }
  const sc = Math.min(SC.w, SC.h) / 900 * .55;
  for (const w of (BLIFE.walk || []).sort((a, b) => a.y - b.y)) {
    const h = heroById(w.id); if (!h) continue;
    if (w.wait > 0) w.wait -= dt; else { const d = w.tx - w.x; if (Math.abs(d) < 4) { w.wait = 2 + Math.random() * 5; w.tx = SC.w * (.12 + Math.random() * .76); } else w.x += Math.sign(d) * w.v * dt; }
    if (!w.sp || w.sp.blank || w.spSc !== sc) { try { w.sp = heroSprite(heroLook(h), {}, 0, sc); w.spSc = sc; } catch (e) { continue; } } const sp = w.sp; if (!sp || sp.blank || !sp.ax) continue;
    const moving = w.wait <= 0, bob = moving ? Math.abs(Math.sin(t * 7 + w.x * .05)) * 3 : 0, left = w.tx < w.x;
    x.save(); x.fillStyle = "rgba(0,0,0,.4)"; x.beginPath(); x.ellipse(w.x, w.y, 16 * sc / .55, 4 * sc / .55, 0, 0, 7); x.fill();
    x.translate(w.x, w.y - bob); if (left) x.scale(-1, 1); x.globalAlpha = .95; x.drawImage(sp, -sp.ax, -sp.ay); x.restore();
  }
}

// ── Météo animée pendant les combats (et neige permanente dans les Cimes) ──
const WX = { p: [], k: "" };
function combatWeather(x, t, dt, stH) {
  const run = S.run; if (!run || S.opts.calm) return; const reg = run.region;
  const kind = run.weather === "pluie" ? "rain" : run.weather === "brouillard" ? "fog" : run.weather === "lune" ? "moon" : reg === "cimes" ? "snow" : reg === "marais" || reg === "cite" ? "mist" : reg === "terres" ? "ash" : "";
  if (!kind) return; const W = SC.w, H = stH || SC.h;
  if (WX.k !== kind) { WX.k = kind; WX.p = []; }
  const N = kind === "rain" ? 160 : kind === "snow" ? 110 : kind === "ash" ? 70 : 0;
  while (WX.p.length < N) WX.p.push({ x: Math.random() * W, y: Math.random() * H, v: .5 + Math.random(), s: Math.random() });
  x.save();
  if (kind === "rain") { x.strokeStyle = "rgba(170,190,220,.32)"; x.lineWidth = 1; x.beginPath(); for (const p of WX.p) { p.y += 900 * p.v * dt; p.x -= 120 * p.v * dt; if (p.y > H) { p.y = -10; p.x = Math.random() * W * 1.2; } x.moveTo(p.x, p.y); x.lineTo(p.x + 4, p.y - 14 * p.v); } x.stroke(); x.fillStyle = "rgba(20,30,50,.12)"; x.fillRect(0, 0, W, H); }
  if (kind === "snow" || kind === "ash") { x.fillStyle = kind === "snow" ? "rgba(235,240,255,.75)" : "rgba(255,150,80,.55)"; for (const p of WX.p) { p.y += (kind === "snow" ? 40 : 25) * p.v * dt; p.x += Math.sin(t * .8 + p.s * 9) * 18 * dt + (kind === "snow" ? -10 : 8) * dt; if (p.y > H) { p.y = -5; p.x = Math.random() * W; } x.beginPath(); x.arc(p.x, p.y, (kind === "snow" ? 1.2 : .9) + p.s * 1.6, 0, 7); x.fill(); } }
  if (kind === "fog" || kind === "mist") { for (let i = 0; i < 4; i++) { const yy = H * (.45 + i * .14), xx = ((t * (8 + i * 5)) % (W * 1.5)) - W * .25; const g = x.createRadialGradient(xx, yy, 0, xx, yy, W * .45); g.addColorStop(0, `rgba(190,200,200,${kind === "fog" ? .16 : .09})`); g.addColorStop(1, "rgba(190,200,200,0)"); x.fillStyle = g; x.fillRect(0, 0, W, H); } if (kind === "fog") { x.fillStyle = "rgba(160,170,170,.08)"; x.fillRect(0, 0, W, H); } }
  if (kind === "moon") { x.fillStyle = `rgba(120,10,10,${.1 + .03 * Math.sin(t * 1.3)})`; x.fillRect(0, 0, W, H); }

}
